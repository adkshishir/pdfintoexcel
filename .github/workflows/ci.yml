name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libmagic
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install lightweight test deps
        # Heavy ML deps (paddleocr, paddlepaddle) are skipped in CI — they
        # would balloon the workflow to several minutes and the OCR engine
        # is dependency-injected in tests anyway. Fail loudly if a real
        # paddleocr import sneaks in.
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi==0.115.6 \
            'uvicorn[standard]==0.32.1' \
            python-multipart==0.0.20 \
            pydantic==2.10.4 \
            pydantic-settings==2.7.0 \
            sqlalchemy==2.0.36 \
            alembic==1.14.0 \
            'celery[redis]==5.4.0' \
            redis==5.2.1 \
            pymupdf==1.25.1 \
            pdfplumber==0.11.4 \
            pandas==2.2.3 \
            openpyxl==3.1.5 \
            pytesseract==0.3.13 \
            pillow==11.0.0 \
            python-magic==0.4.27 \
            boto3==1.35.85 \
            httpx==0.28.1 \
            pytest==8.3.4

      - name: Run pytest
        working-directory: backend
        run: pytest -q tests/

  frontend:
    name: frontend build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npx eslint src/

      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
        run: npx next build
