# Production overlay. Use with the base compose file:
#
#   docker compose \
#     -f infrastructure/docker-compose.yml \
#     -f infrastructure/docker-compose.prod.yml \
#     up -d --build
#
# Differences from the base (dev) compose:
#   - frontend uses its own production Dockerfile (no live source mount,
#     no `npm install` on every boot)
#   - all services restart unless explicitly stopped
#   - no compose-nginx profile — bind frontend/backend to loopback for host nginx
#     (see nginx/host.example.conf). Host ports default to 4017 (API) and 4018
#     (Next) so 127.0.0.1:8000 stays free for other apps. Override with
#     HOST_PORT_BACKEND / HOST_PORT_FRONTEND (e.g. infrastructure/compose.host-ports.env).
#   - reads secrets from `infrastructure/.env.prod` (not committed)
#
# Provide `infrastructure/.env.prod` based on `backend/.env.example`. At
# minimum override:
#   STORAGE_BACKEND=oracle
#   ORACLE_ENDPOINT=...
#   ORACLE_REGION=...
#   ORACLE_ACCESS_KEY=...
#   ORACLE_SECRET_KEY=...
#   STORAGE_BUCKET=...

services:
  postgres:
    restart: unless-stopped
    env_file:
      - .env.prod

  redis:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:${HOST_PORT_BACKEND:-4017}:8000"

  worker:
    restart: unless-stopped
    env_file:
      - .env.prod

  beat:
    restart: unless-stopped
    env_file:
      - .env.prod

  frontend:
    image: ${FRONTEND_IMAGE:-pdf-excel-converter-frontend:latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    command: !reset null   # use the image's CMD (next start), not the dev override
    volumes: !reset []     # no source mount in prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT_FRONTEND:-4018}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      # Server Components / Route Handlers call FastAPI from the Node container.
      INTERNAL_API_URL: http://backend:8000
      # Must match backend ANALYTICS_API_KEY; set in shell or `infrastructure/.env`.
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY:-}

