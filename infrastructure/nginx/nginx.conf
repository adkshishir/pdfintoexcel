worker_processes auto;
events { worker_connections 1024; }

http {
    # --- baseline ---
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Allow uploads up to MAX_UPLOAD_BYTES (30 MB) plus headers overhead.
    client_max_body_size 32m;
    client_body_buffer_size 128k;

    # --- compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    # .xlsx is already a zip — don't re-compress it.

    # --- logging ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream backend  { server backend:8000; keepalive 32; }
    upstream frontend { server frontend:3000; keepalive 32; }

    # Common security headers — hoisted into a reusable block.
    map $sent_http_content_type $referrer_policy {
        default "strict-origin-when-cross-origin";
    }

    server {
        listen 80;
        server_name pdfintoexcel.com www.pdfintoexcel.com;
        # listen 443 ssl http2;        # uncomment with TLS certs in prod
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Security headers applied to every response.
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        # API → FastAPI
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Long-running uploads + worker polls.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            # Don't buffer the .xlsx download — stream it through.
            proxy_buffering    off;
        }

        # Frontend (Next.js). HMR websocket needs Upgrade headers.
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
