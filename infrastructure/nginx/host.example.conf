# Host nginx — copy or include the blocks below (e.g. under
# /etc/nginx/sites-available/). Same routing as infrastructure/nginx/nginx.conf
# but proxies to the Docker-published loopback ports (defaults in compose: 4018 / 4017):
#   Next.js    → 127.0.0.1:4018   (HOST_PORT_FRONTEND)
#   FastAPI    → 127.0.0.1:4017   (HOST_PORT_BACKEND; /api prefix unchanged)
#
# Prerequisites: `make prod-up` (compose-nginx profile is off; no port 80 conflict).
# After editing: `sudo nginx -t && sudo systemctl reload nginx`
#
# Add this `map` once inside the `http { }` block of /etc/nginx/nginx.conf
# (or an included snippet) if it is not already present:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      "";
#   }

server {
    listen 80;
    server_name pdfintoexcel.com www.pdfintoexcel.com;
    # For HTTPS, add listen 443 ssl; + ssl_certificate lines (Let's Encrypt, etc.)

    client_max_body_size 32m;
    client_body_buffer_size 128k;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Job status WebSocket lives under /api/jobs/{id}/ws — needs Upgrade headers.
    location /api/ {
        proxy_pass         http://127.0.0.1:4017;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    location / {
        proxy_pass         http://127.0.0.1:4018;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
